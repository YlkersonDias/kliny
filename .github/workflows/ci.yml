# Build e testes a cada push na main e em cada pull request.
# Localmente o Smart App Control bloqueia o Backend.dll recompilado; aqui ele não existe.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # MySQL descartável, só para os testes de dono do recurso e de cofre (backend.Tests/MySqlApi.cs).
    # A senha vale só para este container, que some no fim do job: não é segredo.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kliny-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pkliny-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore Kliny.sln

      - name: Compilar
        run: dotnet build Kliny.sln --no-restore --configuration Release

      # Sem user-secrets. Os testes com MySQL criam e apagam o próprio banco (kliny_test_<guid>) e um
      # usuário só de DML para a API (o root daqui só roda as migrations e cria esse usuário);
      # sem esta variável no CI eles falham, para não passarem pulados sem ninguém ver.
      - name: Testar
        run: |
          set -o pipefail
          dotnet test --solution Kliny.sln --no-build --configuration Release 2>&1 | tee test-output.log
        env:
          KLINY_TEST_MYSQL: Server=127.0.0.1;Port=3306;User=root;Password=kliny-ci;AllowPublicKeyRetrieval=true

      # Diagnóstico temporário (etapa S.3): o download do log completo do Actions está bloqueado
      # na rede de quem está depurando agora. Remover assim que a causa da falha for encontrada.
      - name: Diagnóstico temporário de falha nos testes
        if: failure()
        run: |
          tail -n 200 test-output.log \
            | sed 's/%/%25/g; s/\r$//' \
            | awk 'BEGIN{ORS="%0A"}{print}' \
            | fold -w 3000 \
            | while IFS= read -r chunk || [ -n "$chunk" ]; do
                echo "::error::$chunk"
              done

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testar
        run: npm test

      - name: Compilar
        run: npm run build
