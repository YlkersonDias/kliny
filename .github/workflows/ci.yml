# As actions ficam fixadas pelo SHA do commit (a tag pode ser movida pelo dono); o Dependabot
# atualiza o SHA e a versão no comentário.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Histórico inteiro: um segredo apagado num commit depois continua no Git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Imagem oficial do gitleaks, fixada pelo digest. Os falsos positivos ficam no .gitleaks.toml;
      # --redact: o valor achado nunca aparece no log.
      - name: Procurar segredos no histórico
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  backend:
    name: Backend (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # MySQL descartável para os testes: a senha vale só para este container.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kliny-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pkliny-ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore Kliny.sln

      - name: Compilar
        run: dotnet build Kliny.sln --no-restore --configuration Release

      # Os testes com MySQL criam e apagam o próprio banco e um usuário só de DML para a API.
      # Sem esta variável no CI eles falham, para não passarem pulados sem ninguém ver.
      - name: Testar
        run: dotnet test --solution Kliny.sln --no-build --configuration Release
        env:
          KLINY_TEST_MYSQL: Server=127.0.0.1;Port=3306;User=root;Password=kliny-ci;AllowPublicKeyRetrieval=true

  frontend:
    name: Frontend (lint, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testar
        run: npm test

      - name: Compilar
        run: npm run build

      - name: Conferir a CSP do build
        run: npm run check:csp

  deploy:
    name: Deploy (imagens Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Monta as imagens do deploy sem publicar nada.
      - name: Conferir o docker-compose.yml
        working-directory: deploy
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml --profile migrate --profile tunnel config --quiet
        env:
          MYSQL_ROOT_PASSWORD: ci
          KLINY_APP_PASSWORD: ci
          KLINY_MIGRATOR_PASSWORD: ci
          KLINY_BACKUP_PASSWORD: ci
          JWT_KEY: ci
          BACKUP_DIR: /tmp/backups

      - name: Montar a API
        run: docker build -f deploy/api.Dockerfile --target api -t kliny-api .

      - name: Montar as migrations
        run: docker build -f deploy/api.Dockerfile --target migrate -t kliny-migrate .

      - name: Montar o frontend (com a conferência da CSP)
        run: docker build -f deploy/web.Dockerfile -t kliny-web .

      - name: Conferir a configuração do nginx
        run: docker run --rm --add-host api:127.0.0.1 kliny-web nginx -t
