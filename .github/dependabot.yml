version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/backend", "/backend.Tests"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      # O Pomelo 9 só suporta o EF Core 9.0.x.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Pomelo.EntityFrameworkCore.MySql"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-desenvolvimento:
        dependency-type: development
      npm-producao:
        dependency-type: production
    ignore:
      # Versões maiores das ferramentas mudam a configuração: migração à parte.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # Os tipos acompanham o Node da linha LTS (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
    groups:
      imagens:
        patterns: ["*"]
    ignore:
      # O Node fica na linha LTS (24).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/deploy"
    schedule:
      interval: weekly
      day: monday
    groups:
      compose:
        patterns: ["*"]
    ignore:
      # O MySQL fica na linha 8.4 LTS.
      - dependency-name: "mysql"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
