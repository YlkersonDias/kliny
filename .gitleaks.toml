# Configuração do gitleaks (job "Segredos" do CI): as regras padrão e só as exceções abaixo, cada
# uma presa ao arquivo e ao valor exatos (condition = "AND"). Valor novo precisa de revisão.

[extend]
useDefault = true

[[allowlists]]
description = "Chaves Idempotency-Key de exemplo do Backend.http (não são segredo)"
condition = "AND"
paths = ['''^backend/Backend\.http$''']
regexes = ['''^exemplo-(deposito|retirada)-\d+$''', '''^3f6c2a1e-9b0d-4c55-8a7e-1d2b3c4d5e6f$''']

[[allowlists]]
description = "Senha de teste do AuthServiceLockoutTests (banco em memória, sem conta real)"
condition = "AND"
paths = ['''^backend\.Tests/AuthServiceLockoutTests\.cs$''']
regexes = ['''^senha-certa-123$''']
