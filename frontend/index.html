<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/mascote/kliny-icone-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/mascote/kliny-icone-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/mascote/kliny-icone-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12132A" />
    <meta name="description" content="Organize receitas, gastos e cofres num lugar só. Grátis, sem anúncios e sem vender seus dados." />
    <!-- A imagem do og:image precisa de endereço completo. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%APP_NAME%" />
    <meta property="og:url" content="https://kliny.app.br/" />
    <meta property="og:title" content="%APP_NAME%: organize seu dinheiro" />
    <meta property="og:description" content="Receitas, gastos e cofres num lugar só. Grátis e sem anúncios." />
    <meta property="og:image" content="https://kliny.app.br/kliny-compartilhar.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="O hamster do %APP_NAME% fazendo contas na toca, ao lado da frase: guarde seu dinheiro como um hamster guarda sementes." />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>%APP_NAME%</title>
    <script>
      // Aplica o tema antes do React, para a tela não piscar. Mesma regra de src/lib/theme.ts.
      (function () {
        var preference = 'dark'
        try {
          var stored = localStorage.getItem('ui.theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
        } catch (e) {}
        var dark = preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var color = document.querySelector('meta[name="theme-color"]')
        if (color) color.setAttribute('content', dark ? '#12132A' : '#E0E0EE')
      })()
    </script>
    <script>
      // Mesma regra de src/lib/language.ts. Num <script> separado: duas "(function () {...})()"
      // seguidas sem ponto e vírgula viram uma chamada só.
      (function () {
        var language = 'pt-BR'
        try {
          if (localStorage.getItem('ui.language') === 'en-US') language = 'en-US'
        } catch (e) {}
        document.documentElement.lang = language
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
