# nginx do Kliny (S.7): serve o frontend e repassa /api para a API, no mesmo endereço (sem CORS).
# Só recebe pedidos do cloudflared, pela rede interna do Docker (nenhuma porta é publicada no PC).

# Log sem a query string nem o Referer: a URL do /api pode trazer o texto buscado no extrato
# (?search=) e as datas dos relatórios, e o Referer traz a URL da página com os filtros. Ficam o
# método, o caminho, o status, o tamanho, o tempo e o IP (regra 16). O access_log vai dentro de
# cada server, para substituir o do nginx.conf da imagem (formato "main", com a URL inteira).
log_format kliny '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent $request_time "$http_user_agent"';

# Pedido de outro Host (que não seja o domínio do Kliny): fecha a conexão sem resposta.
server {
    listen 8080 default_server;
    server_tokens off;
    access_log /var/log/nginx/access.log kliny;
    return 444;
}

# Pelo túnel, o pedido chega com HTTPS do lado do visitante; sem o cabeçalho da Cloudflare
# (teste local), vale o esquema do próprio pedido.
map $http_cf_connecting_ip $original_proto {
    ""      $scheme;
    default https;
}

server {
    listen 8080;
    server_name kliny.app.br www.kliny.app.br localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log kliny;
    root /usr/share/nginx/html;

    # IP real de quem acessa: a Cloudflare põe no CF-Connecting-IP, e só a rede interna (o
    # cloudflared) é confiável para trazê-lo. É esse IP que vai para a API no X-Forwarded-For.
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 64k;

    # Endereço da API pelo DNS do Docker, conferido de novo a cada 10 s. Com o nome fixo no
    # proxy_pass, o nginx guardava o IP da subida: recriar só a API (up -d sem --build) deixava o
    # /api/ em 502 até reiniciar o web (aconteceu ao publicar a v1.10.1). Com a variável e sem
    # caminho no proxy_pass, o pedido vai para a API com o caminho original.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Os cabeçalhos de segurança da API (S.4) passam como vieram; nenhum é acrescentado aqui.
    }

    # Importação de extrato (8.3): até 1.000 linhas por pedido, então 1 MB só aqui (a API tem o
    # mesmo limite no ImportsController). O resto igual ao /api/.
    location /api/imports {
        client_max_body_size 1m;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Arquivos do build com hash no nome: nunca mudam.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /mascote/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html, sw.js, manifesto e o resto: sempre conferidos com o servidor, senão o aviso de
    # nova versão (7.4) demoraria a aparecer. As rotas do app caem no index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
