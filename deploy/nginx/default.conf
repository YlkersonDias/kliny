# nginx do Kliny (S.7): serve o frontend e repassa /api para a API, no mesmo endereço (sem CORS).
# Só recebe pedidos do cloudflared, pela rede interna do Docker (nenhuma porta é publicada no PC).

# Pedido de outro Host (que não seja o domínio do Kliny): fecha a conexão sem resposta.
server {
    listen 8080 default_server;
    server_tokens off;
    return 444;
}

# Pelo túnel, o pedido chega com HTTPS do lado do visitante; sem o cabeçalho da Cloudflare
# (teste local), vale o esquema do próprio pedido.
map $http_cf_connecting_ip $original_proto {
    ""      $scheme;
    default https;
}

server {
    listen 8080;
    server_name kliny.app.br www.kliny.app.br localhost;
    server_tokens off;
    root /usr/share/nginx/html;

    # IP real de quem acessa: a Cloudflare põe no CF-Connecting-IP, e só a rede interna (o
    # cloudflared) é confiável para trazê-lo. É esse IP que vai para a API no X-Forwarded-For.
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Os cabeçalhos de segurança da API (S.4) passam como vieram; nenhum é acrescentado aqui.
    }

    # Importação de extrato (8.3): até 1.000 linhas por pedido, então 1 MB só aqui (a API tem o
    # mesmo limite no ImportsController). O resto igual ao /api/.
    location /api/imports {
        client_max_body_size 1m;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Arquivos do build com hash no nome: nunca mudam.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /mascote/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html, sw.js, manifesto e o resto: sempre conferidos com o servidor, senão o aviso de
    # nova versão (7.4) demoraria a aparecer. As rotas do app caem no index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
