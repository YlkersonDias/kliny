# Serve o frontend e repassa /api para a API, no mesmo endereço (sem CORS). Só recebe pedidos do
# cloudflared, pela rede interna do Docker.

# Log sem a query string nem o Referer: a URL do /api traz o texto buscado e as datas dos
# relatórios. O access_log vai em cada server, para substituir o formato "main" da imagem.
log_format kliny '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                 '$status $body_bytes_sent $request_time "$http_user_agent"';

# Pedido de outro Host: fecha a conexão sem resposta.
server {
    listen 8080 default_server;
    server_tokens off;
    access_log /var/log/nginx/access.log kliny;
    return 444;
}

# Pelo túnel, o visitante usa HTTPS; sem o cabeçalho da Cloudflare (teste local), vale o do pedido.
map $http_cf_connecting_ip $original_proto {
    ""      $scheme;
    default https;
}

server {
    listen 8080;
    server_name kliny.app.br www.kliny.app.br localhost;
    server_tokens off;
    access_log /var/log/nginx/access.log kliny;
    root /usr/share/nginx/html;

    # Só a rede interna (o cloudflared) é confiável para trazer o CF-Connecting-IP.
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    client_max_body_size 64k;

    # Endereço da API pelo DNS do Docker, conferido a cada 10 s: com o nome fixo no proxy_pass, o
    # nginx guardaria o IP da subida, e recriar só a API deixaria o /api/ em 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Os cabeçalhos de segurança da API passam como vieram.
    }

    # Até 1.000 linhas por pedido: 1 MB só aqui (a API tem o mesmo limite).
    location /api/imports {
        client_max_body_size 1m;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $original_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Arquivos do build com hash no nome: nunca mudam.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /mascote/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Sempre conferidos com o servidor, senão o aviso de nova versão do PWA demoraria a aparecer.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
