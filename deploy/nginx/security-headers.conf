# Cabeçalhos de segurança do frontend (S.7). Incluído em cada location: no nginx, um add_header
# dentro de uma location apaga os herdados do server.
#
# A CSP completa continua na <meta> do index.html (com os hashes calculados no build). Esta aqui
# só acrescenta o frame-ancestors, que o navegador ignora numa <meta>: com duas políticas, o
# navegador aplica as duas.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Não "no-referrer" como na API: o botão do Google confere a origem da página.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# 30 dias, sem includeSubDomains nem preload, como na API (S.4). O navegador só aceita em HTTPS,
# que é como o site chega a ele, pela Cloudflare.
add_header Strict-Transport-Security "max-age=2592000" always;
