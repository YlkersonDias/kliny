# Incluído em cada location: no nginx, um add_header dentro de uma location apaga os do server.
# A CSP completa está na <meta> do index.html; aqui só o frame-ancestors, que a <meta> não aceita.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Não "no-referrer" como na API: o botão do Google confere a origem da página.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# 30 dias, sem includeSubDomains nem preload, como na API.
add_header Strict-Transport-Security "max-age=2592000" always;
